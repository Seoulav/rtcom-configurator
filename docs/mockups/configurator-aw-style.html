<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구성기 시안 · Analog Way 구조 + LED 스킨</title><style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-display:swap;src:url("../../fonts/PretendardVariable.woff2") format("woff2-variations")}
:root{--paper:#EEF1F6;--ink:#1C1C1E;--ink-2:#3A3A3C;--muted:#8A8A8E;--line:rgba(60,60,67,.12);--line-2:rgba(60,60,67,.2);--accent:#007AFF;--accent-2:#0057D8;--tint:rgba(0,122,255,.10);--field:rgba(118,118,128,.10);--ok:#1E9E52;
--glass:rgba(255,255,255,.62);--stroke:rgba(255,255,255,.7);--shadow:0 1px 2px rgba(20,26,40,.04),0 18px 48px -20px rgba(20,26,40,.28);
--sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
background:radial-gradient(58vw 58vw at 12% -8%,rgba(0,122,255,.28),transparent 60%),radial-gradient(50vw 50vw at 92% 4%,rgba(191,90,242,.22),transparent 60%),radial-gradient(60vw 60vw at 78% 96%,rgba(48,209,196,.2),transparent 62%),radial-gradient(46vw 46vw at 6% 92%,rgba(255,149,0,.16),transparent 60%),var(--paper);background-attachment:fixed}
.wrap{max-width:1320px;margin:0 auto;padding:22px 22px 40px}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;box-shadow:var(--shadow);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px)}
/* 머리 + 단계 탭 (Analog Way: 왼쪽 로고 / 오른쪽 단계) */
.bar{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:24px;padding:14px 22px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(150deg,#0A84FF,#5E5CE6 55%,#BF5AF2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 8px 20px -6px rgba(10,132,255,.6);display:grid;place-items:center;position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 46%)}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}.brand small{font-size:11px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.steps{display:flex;gap:14px;justify-content:flex-end}
.st{display:flex;align-items:center;gap:8px;padding:8px 2px 10px;border-bottom:2px solid var(--line-2);font-size:13px;font-weight:600;color:var(--muted);flex:0 1 auto;white-space:nowrap}
.st i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--field);color:var(--muted)}
.st.done{border-color:var(--accent);color:var(--ink-2)}.st.done i{background:var(--tint);color:var(--accent)}
.st.cur{border-color:var(--accent);color:var(--accent);flex-grow:1}.st.cur i{background:var(--accent);color:#fff}
/* 좌우 분할 (Analog Way: 왼쪽 선택 목록 / 오른쪽 고정 미리보기) */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:600px;overflow:hidden;padding:0}
.pick{padding:34px 34px 28px;display:flex;flex-direction:column}
.pick h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}.pick .sub{margin:0 0 20px;color:var(--muted);font-size:13px}
.idx{display:block;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.opt{display:grid;grid-template-columns:150px 1fr 14px;gap:14px;align-items:start;padding:14px 16px;margin-bottom:8px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--line);cursor:pointer}
.opt b{font-size:16px;font-weight:800;letter-spacing:-.01em}.opt b small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:2px}
.opt ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.opt .dot{width:10px;height:10px;border-radius:50%;background:rgba(118,118,128,.35);margin-top:5px}
.opt.on{background:#fff;border-color:transparent;box-shadow:0 0 0 2px var(--accent),0 10px 24px -14px rgba(0,122,255,.55)}.opt.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(30,158,82,.18)}
.pick .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:18px}
.btn{font:600 13px/1 var(--sans);border:0;border-radius:980px;background:var(--field);color:var(--accent);padding:10px 16px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px -6px var(--accent);padding:12px 20px}
.prev{background:linear-gradient(160deg,rgba(0,122,255,.07),rgba(94,92,230,.07));border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:14px;position:relative}
.prev .seg{position:absolute;top:18px;right:18px;display:inline-flex;gap:2px;padding:2px;background:rgba(118,118,128,.14);border-radius:11px}
.seg span{border-radius:9px;font-weight:600;font-size:12.5px;padding:6px 13px}.seg .on{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.1)}
.prev img.hero{max-width:86%;max-height:380px;object-fit:contain;filter:drop-shadow(0 24px 30px rgba(20,26,40,.25))}
.prev .cap{text-align:center}.prev .cap b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}.prev .cap span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.chips em{font-style:normal;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:980px;background:rgba(255,255,255,.8);color:var(--ink-2)}
/* 03 카드 슬롯 (Analog Way I/O: 가운데 제목 + 실제 후면 + 빈 칸은 흰색) */
.io{padding:30px 30px 26px;text-align:center}
.io h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}.io .sub{margin:4px 0 18px;color:var(--muted);font-size:13px}
.io-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start;text-align:left}
.rackwrap{background:#fff;border-radius:18px;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;align-items:center}
.rack{position:relative;width:min(100%,560px);aspect-ratio:452/419}
.rack>img{position:absolute;inset:0;width:100%;height:100%;filter:grayscale(.15)}
.zone{position:absolute;display:grid;gap:0}
.slot{container-type:size;position:relative;border:1px solid #c9ced6;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.slot .no{position:absolute;bottom:4px;left:50%;transform:translateX(-50%) rotate(-90deg);transform-origin:center;font-size:8.5px;font-weight:700;color:#9aa1ac;letter-spacing:.06em;white-space:nowrap}
.slot .plus{color:#b7bdc6;font-size:15px;font-weight:300;opacity:0}.slot:hover .plus{opacity:1}
.slot.filled{border-color:#2a3038;background:#1a1f25}
.slot.filled img{width:100cqh;height:100cqw;object-fit:fill;transform:rotate(-90deg);flex:none;position:absolute}
.slot.sel{outline:2px solid var(--accent);outline-offset:-2px;background:linear-gradient(rgba(0,122,255,.10),rgba(0,122,255,.10)),#fff}.slot.sel .plus{opacity:1;color:var(--accent)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:11.5px;color:var(--muted);font-weight:600}.legend span{white-space:nowrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.summary{padding:18px}
.summary h3{margin:0 0 2px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.summary .m{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.meter{margin:8px 0}.meter div{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink-2)}.meter>span{display:block;height:6px;border-radius:6px;background:rgba(118,118,128,.14);margin-top:5px;overflow:hidden}.meter>span i{display:block;height:100%;background:var(--accent);border-radius:6px}
.crow{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:12px;background:var(--field);margin-top:6px}
.crow img{width:70px;height:20px;object-fit:contain;background:#fff;border-radius:5px}.crow b{font-size:12.5px}.crow small{display:block;font-size:11px;color:var(--muted)}.crow em{font-style:normal;font-size:12px;font-weight:800;color:var(--accent)}
.io .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
/* 블랭크 커버 · 완성도 */
.slot.blank{border-color:#5b626c;background:#3a4048}
.slot.blank img{width:100cqh;height:100cqw;object-fit:fill;transform:rotate(-90deg);flex:none;position:absolute;opacity:.95}
.fillbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:14px;padding:10px 12px;border-radius:14px;background:rgba(0,122,255,.07)}
.fillbar span{font-size:12.5px;color:var(--ink-2);font-weight:600}.fillbar b{color:var(--accent)}
.comp{margin:14px 0 4px}.comp .head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:980px}.pill.no{background:rgba(224,138,32,.14);color:#C7590A}.pill.ok{background:rgba(30,158,82,.14);color:#177A41}
.segbar{display:flex;height:9px;border-radius:9px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px #c9ced6;margin-top:7px}.segbar i{display:block;height:100%}
.segleg{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--muted);font-weight:600}.segleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.done-banner{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 14px;padding:8px 14px;border-radius:980px;background:rgba(30,158,82,.12);color:#177A41;font-weight:700;font-size:13px;width:max-content}
.choice.blankopt img{background:#3a4048}
.choice .zero{color:var(--muted);background:var(--field)}
.sep{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:10px 2px 6px}
/* 카드 선택 팝업 */
.modal{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:560px;padding:20px;text-align:left;background:rgba(255,255,255,.9);z-index:3}
.scrim{position:absolute;inset:0;background:rgba(28,28,30,.25);border-radius:24px;z-index:2}
.modal h3{margin:0;font-size:17px;font-weight:800}.modal p{margin:3px 0 12px;color:var(--muted);font-size:12.5px}
.choice{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:7px}
.choice img{width:120px;height:26px;object-fit:contain;background:#12161b;border-radius:5px}.choice b{font-size:13.5px}.choice small{display:block;font-size:11.5px;color:var(--muted)}
.choice em{font-style:normal;font-size:12px;font-weight:800;color:var(--accent-2);background:var(--tint);padding:3px 9px;border-radius:980px}
.choice.on{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.rel{position:relative}
/* 04 전송기 미리보기 체인 */
.chain{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:nowrap}
.node{background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:0 10px 24px -16px rgba(20,26,40,.45);width:132px;flex:none}.node svg{display:block;margin:0 auto 6px}
.node img{height:54px;max-width:150px;object-fit:contain;display:block;margin:0 auto 6px}.node b{font-size:13px}.node small{display:block;font-size:11px;color:var(--muted)}
.arrow{color:var(--accent);font-weight:800;font-size:18px}
.cable{width:96px;flex:none;text-align:center;font-size:11px;font-weight:700;color:#1E9E52;line-height:1.35;padding-bottom:6px;border-bottom:2px dashed #1E9E52;position:relative}.cable::after{content:'';position:absolute;right:-2px;bottom:-6px;border:5px solid transparent;border-left-color:#1E9E52}
.grp{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 8px}
.tag{position:fixed;top:8px;right:8px;background:#D70015;color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;z-index:9}
.screen{margin-bottom:34px}.screen-label{font-size:12px;font-weight:700;color:var(--muted);margin:0 4px 8px}
@media(max-width:820px){.bar{grid-template-columns:1fr}.steps{justify-content:flex-start;overflow-x:auto}.st:not(.cur) span{display:none}.split{grid-template-columns:1fr}.prev{order:-1;min-height:260px;border-left:0;border-bottom:1px solid var(--line)}.prev img.hero{max-height:200px}.opt{grid-template-columns:1fr 14px}.opt ul{grid-column:1}.io-grid{grid-template-columns:1fr}.modal{width:92%}}
</style></head><body><div class="wrap" id="app"></div><span class="tag">시안 · 실제 사이트 아님</span>
<script>
const A='../../output/design/assets/',F=A+'frames/',C=A+'cards/',E=A+'extenders/';
const step=new URLSearchParams(location.search).get('step')||'2';
const STEPS=['제품군','섀시','카드 슬롯','전송기','구성 검토','내보내기'];
const bar=cur=>`<header class="bar glass"><div class="brand"><div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><g opacity=".95">${[0,1,2,3].map(r=>[0,1,2,3].map(c=>`<rect x="${2+c*5.3}" y="${2+r*5.3}" width="4" height="4" rx="1"/>`).join('')).join('')}</g></svg></div><div><b>RTCOM Matrix Configurator</b><small>XDM · SPX · VDM 모듈형 매트릭스</small></div></div>
<nav class="steps">${STEPS.map((s,i)=>`<span class="st ${i+1<cur?'done':i+1===cur?'cur':''}"><i>${i+1<cur?'✓':i+1}</i><span>${s}</span></span>`).join('')}</nav></header>`;
const opt=(name,sub,lines,on)=>`<div class="opt ${on?'on':''}"><b>${name}${sub?`<small>${sub}</small>`:''}</b><ul>${lines.map(l=>`<li>${l}</li>`).join('')}</ul><span class="dot"></span></div>`;
const foot=(back,next)=>`<div class="foot">${back?`<span class="btn">← ${back}</span>`:'<span></span>'}<span class="btn primary">${next} →</span></div>`;
const S={};
S['1']=bar(1)+`<section class="glass split"><div class="pick"><span class="idx">01</span><h2>제품군을 선택하세요</h2><p class="sub">제품군마다 섀시·카드·전송기 선택 항목이 달라집니다.</p>
${opt('XDM','eXtreme Digital Matrix',['4K60 4:4:4 · 18Gbps','12×12 ~ 216×216 · 섀시 6종','HDMI · DP · 12G-SDI · HDBaseT 3.0 · 광'],1)}
${opt('SPX','Signal Processing eXpert',['4K60 4:4:4 · 출력별 독립 스케일링','8×10 ~ 24×120 · 섀시 5종','HDMI 입력 · HDMI·CATx 출력'],0)}
${opt('VDM','Variety Digital Matrix',['4K30 4:4:4 · 10.2Gbps','8×8 ~ 288×288 · 섀시 10종','HDMI · 3G-SDI · HDBaseT · 광'],0)}
${foot('','섀시 선택')}</div>
<div class="prev"><img class="hero" src="${A}xdm.jpg" alt=""><div class="cap"><b>XDM Series</b><span>다양한 고해상도 신호를 하나로</span></div><div class="chips"><em>HDMI · DP · SDI</em><em>CAT · 광 전송</em></div></div></section>`;
const X=[['XDM-12','4U','3 / 3','12×12'],['XDM-20','9U','5 / 5','20×20'],['XDM-36','9U','9 / 9','36×36'],['XDM-72','16U','18 / 18','72×72'],['XDM-144','29U','36 / 36','144×144'],['XDM-216','40U','54 / 54','216×216']];
S['2']=bar(2)+`<section class="glass split"><div class="pick"><span class="idx">02</span><h2>섀시를 선택하세요</h2><p class="sub">XDM 제품군 · 메인프레임 6종 · 카드당 4채널</p>
${X.map(x=>opt(x[0],x[1]+' 랙',[`입력·출력 슬롯 ${x[2]}`,`최대 ${x[3]} 채널`],x[0]==='XDM-36')).join('')}
${foot('제품군','카드 슬롯 구성')}</div>
<div class="prev"><span class="seg"><span class="on">정면</span><span>후면</span></span><img class="hero" src="${F}xdm-36-front.webp" alt=""><div class="cap"><b>XDM-36</b><span>9U · 입력 9 / 출력 9 슬롯 · 최대 36×36</span></div><div class="chips"><em>이중화 전원</em><em>핫스왑</em><em>전면 LCD 터치</em></div></div></section>`;
// 03 카드 슬롯: rearPhotos['XDM-36'] 좌표 그대로
const W=452,H=419,IN=[9,34,214,252],OUT=[214,34,419,252];
const BASE={'in-1':'XDM-HIS100','in-2':'XDM-CIS100','out-1':'XDM-HOS100','out-2':'XDM-COS100'};
let placed=BASE;
const allIds=[...Array.from({length:9},(_,i)=>'in-'+(i+1)),...Array.from({length:9},(_,i)=>'out-'+(i+1))];
const zone=(dir,[x0,y0,x1,y1],sel)=>`<div class="zone" style="left:${x0/W*100}%;top:${y0/H*100}%;width:${(x1-x0)/W*100}%;height:${(y1-y0)/H*100}%;grid-template-columns:repeat(9,1fr)">${Array.from({length:9},(_,i)=>{const id=`${dir}-${i+1}`,c=placed[id],bl=c==='BLANK';return `<div class="slot ${bl?'blank':c?'filled':''} ${id===sel?'sel':''}">${c?`<img src="${C}${bl?'XDM-BLANK':c}.webp" alt="">`:`<span class="plus">+</span><span class="no">${dir==='in'?'IN':'OUT'} ${i+1}</span>`}</div>`}).join('')}</div>`;
const row=(c,t)=>`<div class="crow"><img src="${C}${c}.webp" alt=""><div><b>${c}</b><small>${t}</small></div><em>×1</em></div>`;
const io=(sel,modal)=>{const cards=allIds.filter(i=>placed[i]&&placed[i]!=='BLANK').length,blanks=allIds.filter(i=>placed[i]==='BLANK').length,empty=18-cards-blanks,done=!empty;return bar(3)+`<section class="glass io rel"><span class="idx">03</span>${done?'<div class="done-banner">✓ 18개 슬롯을 모두 채웠습니다 · 구성 완성</div>':''}<h2>후면의 빈 칸을 눌러 카드를 장착하세요</h2><p class="sub">XDM-36 · 왼쪽 입력 9슬롯 / 오른쪽 출력 9슬롯 · 카드당 4채널</p>
<div class="io-grid"><div class="rackwrap"><div class="rack"><img src="${F}xdm-36-rear.webp" alt="">${zone('in',IN,sel)}${zone('out',OUT,sel)}</div>
<div class="legend"><span><i style="background:#fff;border:1px solid #c9ced6"></i>빈 슬롯(눌러서 선택)</span><span><i style="background:#1a1f25"></i>장착한 카드</span><span><i style="background:#3a4048"></i>블랭크 커버</span><span><i style="background:rgba(0,122,255,.2);border:1.5px solid #007AFF"></i>선택 중</span></div>
${empty?`<div class="fillbar"><span>비어 있는 슬롯 <b>${empty}개</b> — 카드를 더 넣지 않을 슬롯은 블랭크 커버로 막아 구성을 완성하세요.</span><span class="btn primary" style="padding:9px 14px">남은 ${empty}칸 블랭크로 채우기</span></div>`:''}</div>
