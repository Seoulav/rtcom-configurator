<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("../../fonts/PretendardVariable.woff2") format("woff2-variations")}
:root{color-scheme:light;--paper:#EEF1F6;--ink:#1C1C1E;--ink-2:#3A3A3C;--muted:#8A8A8E;--line:rgba(60,60,67,.12);--line-2:rgba(60,60,67,.20);

--glass-fill:rgba(255,255,255,.62);--glass-stroke:rgba(255,255,255,.7);--glass-blur:saturate(180%) blur(30px);--field-fill:rgba(118,118,128,.10);--seg-track:rgba(118,118,128,.14);
--shadow-card:0 1px 2px rgba(20,26,40,.04),0 18px 48px -20px rgba(20,26,40,.28);--r-card:24px;--r-inner:16px;--r-pill:980px;
--sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative}
.bg-orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(58vw 58vw at 12% -8%,rgba(0,122,255,.28),transparent 60%),radial-gradient(50vw 50vw at 92% 4%,rgba(191,90,242,.22),transparent 60%),radial-gradient(60vw 60vw at 78% 96%,rgba(48,209,196,.20),transparent 62%),radial-gradient(46vw 46vw at 6% 92%,rgba(255,149,0,.16),transparent 60%)}
.wrap{max-width:1180px;margin:0 auto;padding:34px 22px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.brandmark{display:flex;align-items:center;gap:15px}
.swatch{width:52px;height:52px;border-radius:14px;background:linear-gradient(150deg,#0A84FF,#5E5CE6 55%,#BF5AF2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 8px 20px -6px rgba(10,132,255,.6);display:grid;place-items:center;position:relative;overflow:hidden}
.swatch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 46%)}
.title-block h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.title-block .sub{font-size:11px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;margin:3px 0 0}
.toolbar{display:flex;gap:9px;flex-wrap:wrap}
.btn{font:600 13px/1 var(--sans);border:1px solid transparent;background:var(--field-fill);color:var(--accent);padding:9px 16px;border-radius:var(--r-pill);white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px -6px var(--accent)}
.cols{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--glass-fill);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-stroke);border-radius:var(--r-card);padding:22px;box-shadow:var(--shadow-card)}
.card h2{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 16px;display:flex;align-items:center;gap:9px}
.card h2 .idx{color:var(--accent);font-size:14px;font-weight:700}
.card h2 .note{text-transform:none;letter-spacing:0;font-weight:500}
.lead{font-size:15px;line-height:1.6;color:var(--ink-2);margin:0 0 14px}.lead b{color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--field-fill);border-radius:13px;padding:10px 12px}
.fact span{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.fact b{font-size:18px;font-weight:800;letter-spacing:-.01em}.fact small{font-size:12px;color:var(--ink-2);font-weight:600;margin-left:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:none}
th{font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--field-fill)}
td:first-child{color:var(--muted);font-weight:600;width:34%}td{color:var(--ink-2)}
.tableWrap{border-radius:var(--r-inner);border:1px solid var(--line);overflow:hidden}
.hint{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.45}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:13px;color:var(--ink-2);font-weight:600}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks i{flex:none;width:18px;height:18px;border-radius:6px;background:var(--accent);display:grid;place-items:center;margin-top:1px}
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--seg-track);border-radius:11px}
.seg span{border-radius:9px;font-weight:600;font-size:13px;padding:7px 14px;color:var(--ink)}.seg .on{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.10)}
.panel{background:#fff;border-radius:var(--r-inner);border:1px solid var(--line);padding:14px 10px 6px;margin-top:14px}
.ports{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.port{background:var(--field-fill);border-radius:13px;padding:10px 12px;font-size:12px;color:var(--ink-2);line-height:1.45}
.port b{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink);margin-bottom:3px}
.n{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:var(--accent-tint);color:var(--accent-2)}
.foot{font-size:11.5px;color:var(--muted);line-height:1.6;padding:4px 2px}
.foot b{color:var(--ink-2)}
.tag{position:fixed;top:8px;right:8px;background:#D70015;color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;z-index:5}
@media(max-width:1000px){.cols{grid-template-columns:1fr}.ports{grid-template-columns:1fr 1fr}}

.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.frame{background:var(--field-fill);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px}
.frame .ph{height:74px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden}
.frame .ph img{max-width:92%;max-height:68px;object-fit:contain}
.frame .ph em{font-style:normal;font-size:11px;color:var(--muted)}
.frame b{font-size:14px;font-weight:800;letter-spacing:-.01em}.frame small{font-size:11.5px;color:var(--ink-2);font-weight:600}
.ru{height:6px;border-radius:6px;background:rgba(118,118,128,.14);overflow:hidden}.ru i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0A84FF,#5E5CE6)}
.frame .flag{align-self:flex-start;font-size:10px;font-weight:700;padding:2px 7px;border-radius:980px;background:var(--purple-tint);color:var(--purple-ink)}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cardcol h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cardrow{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:12px;background:var(--field-fill);margin-bottom:6px}
.cardrow img{width:86px;height:26px;object-fit:contain;background:#fff;border-radius:6px}
.cardrow b{font-size:13px}.cardrow span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.cardrow .pc{font-size:12px;font-weight:800;color:var(--accent-2);background:var(--accent-tint);padding:3px 8px;border-radius:980px;white-space:nowrap}
.cardrow .pc.out{color:var(--purple-ink);background:var(--purple-tint)}
.more{font-size:12px;color:var(--accent);font-weight:600;margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:600}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

<div class="frames">${d.frames.map(f=>`<div class="frame"><div class="ph">${f[3]?`<img src="${F}${f[3]}" alt="">`:'<em>사진 준비 중</em>'}</div><b>${f[0]}</b><small>${f[1]} · ${f[2]}U</small><div class="ru"><i style="width:${Math.max(8,f[2]/d.maxRU*100)}%"></i></div>${f[4]?`<span class="flag">${f[4]}</span>`:''}</div>`).join('')}</div></section>

// 신호 구성도
(()=>{const ins=d.inCards,outs=d.outCards,n=Math.max(ins.length,outs.length),rh=40,H=n*rh+40,W=760,svg=document.getElementById('arch');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const mx=300,mw=160,my=14,mh=H-28;let h=`<defs><linearGradient id="mf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A84FF"/><stop offset=".55" stop-color="#5E5CE6"/><stop offset="1" stop-color="#BF5AF2"/></linearGradient></defs>`;
h+=`<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" rx="18" fill="url(#mf)"/><rect x="${mx}" y="${my}" width="${mw}" height="${mh}" rx="18" fill="url(#mf)" opacity=".0"/>`;
for(let i=0;i<5;i++)h+=`<path d="M${mx+22} ${my+30+i*(mh-60)/4}H${mx+mw-22}" stroke="#fff" stroke-opacity=".22" stroke-width="1.2"/>`;
for(let i=0;i<4;i++)h+=`<path d="M${mx+40+i*27} ${my+22}V${my+mh-22}" stroke="#fff" stroke-opacity=".22" stroke-width="1.2"/>`;
h+=`<text x="${mx+mw/2}" y="${my+mh/2-6}" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">${d.name.split(' ')[0]} 메인프레임</text><text x="${mx+mw/2}" y="${my+mh/2+14}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" fill-opacity=".85">크로스 스위칭 · 심리스</text>`;
const y0=(len)=>H/2-(len-1)*rh/2;
ins.forEach((c,i)=>{const y=y0(ins.length)+i*rh,col=SIG[c[2]];if(c[4])h+=`<rect x="4" y="${y-12}" width="92" height="24" rx="12" fill="none" stroke="#8A8A8E" stroke-dasharray="4 3"/><text x="50" y="${y+4}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3A3A3C">${c[4].split(' · ')[0]}</text><path d="M96 ${y}H112" stroke="#8A8A8E" stroke-width="1.5" stroke-dasharray="3 3"/>`;
h+=`<rect x="112" y="${y-14}" width="140" height="28" rx="14" fill="${col}" fill-opacity=".12"/><circle cx="128" cy="${y}" r="4.5" fill="${col}"/><text x="140" y="${y+4.5}" font-size="12" font-weight="700" fill="#1C1C1E">${c[0]}</text><path d="M252 ${y}C276 ${y} 276 ${H/2+(y-H/2)*.6} ${mx} ${H/2+(y-H/2)*.6}" fill="none" stroke="${col}" stroke-width="2"/>`});
outs.forEach((c,i)=>{const y=y0(outs.length)+i*rh,col=SIG[c[2]],x=508;h+=`<path d="M${mx+mw} ${H/2+(y-H/2)*.6}C${x-24} ${H/2+(y-H/2)*.6} ${x-24} ${y} ${x} ${y}" fill="none" stroke="${col}" stroke-width="2"/><rect x="${x}" y="${y-14}" width="140" height="28" rx="14" fill="${col}" fill-opacity=".12"/><circle cx="${x+16}" cy="${y}" r="4.5" fill="${col}"/><text x="${x+28}" y="${y+4.5}" font-size="12" font-weight="700" fill="#1C1C1E">${c[0]}</text>`;
if(c[4])h+=`<path d="M${x+140} ${y}H${x+156}" stroke="#8A8A8E" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="${x+156}" y="${y-12}" width="92" height="24" rx="12" fill="none" stroke="#8A8A8E" stroke-dasharray="4 3"/><text x="${x+202}" y="${y+4}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3A3A3C">${c[4].split(' · ')[0]}</text>`});
svg.innerHTML=h})();
</script></body></html>
